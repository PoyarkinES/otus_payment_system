name: Shared NuGet packages
description: Download Shared NuGet packages built by pack-shared and register them as a local NuGet source.

runs:
  using: composite
  steps:
    - name: Download Shared packages
      uses: actions/download-artifact@v4
      with:
        name: shared-packages
        path: artifacts/packages

    - name: Add local NuGet source
      shell: bash
      run: dotnet nuget add source artifacts/packages --name shared-packages --configfile NuGet.config
