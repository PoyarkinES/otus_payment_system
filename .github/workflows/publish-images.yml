name: Publish container images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: poyarkines

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: otus-payment-system-identity
            dockerfile: Identity/Dockerfile
          - image: otus-payment-system-gateway
            dockerfile: Gateway/Dockerfile
          - image: otus-payment-system-wallets
            dockerfile: Wallets/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:sha-${{ github.sha }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          build-args: |
            NUGET_USERNAME=${{ github.actor }}

  verify-compose:
    name: Verify Compose uses published SHA
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Compose points to published images
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          POSTGRES_DB: otus_identity
          POSTGRES_USER: otus
          POSTGRES_PASSWORD: otus
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config -q
          images="$(docker compose -f docker-compose.yml config --images)"

          for service in identity gateway wallets; do
            image="${REGISTRY}/${IMAGE_OWNER}/otus-payment-system-${service}:${IMAGE_TAG}"
            matches=$(printf '%s\n' "$images" | grep -F -x -c "$image" || true)
            if [[ "$matches" -ne 1 ]]; then
              echo "::error::Compose is not pinned to the published image $image. Update docker-compose.yml and rerun this workflow."
              exit 1
            fi

            docker manifest inspect "$image" > /dev/null
          done
