name: Publish Shared packages

on:
  push:
    tags:
      - 'shared-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate release tag version
        id: validate
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#shared-v}"

          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must contain a valid SemVer version; got '$tag_version'."
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "Shared package version will be taken from release tag: $tag_version"

      - name: Pack Shared packages
        env:
          SHARED_VERSION: ${{ steps.validate.outputs.version }}
        run: |
          mkdir -p artifacts/packages
          dotnet pack Shared/src/Otus.PaymentSystem.SharedKernel/Otus.PaymentSystem.SharedKernel.csproj \
            -p:Version="$SHARED_VERSION" -c Release -o artifacts/packages
          dotnet pack Shared/src/Otus.PaymentSystem.AspNetCore/Otus.PaymentSystem.AspNetCore.csproj \
            -p:Version="$SHARED_VERSION" -c Release -o artifacts/packages

      - name: Publish to GitHub Packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          packages=(artifacts/packages/*.nupkg)
          if [[ ${#packages[@]} -ne 2 ]]; then
            echo "Expected two packages; got ${#packages[@]}"
            exit 1
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source "https://nuget.pkg.github.com/PoyarkinES/index.json"
          done
