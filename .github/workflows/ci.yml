name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pack-shared:
    name: Pack Shared NuGet packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: |
          mkdir -p artifacts/packages
          dotnet pack Shared/src/Otus.PaymentSystem.SharedKernel/Otus.PaymentSystem.SharedKernel.csproj -c Release -o artifacts/packages
          dotnet pack Shared/src/Otus.PaymentSystem.AspNetCore/Otus.PaymentSystem.AspNetCore.csproj -c Release -o artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: shared-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: pack-shared

    strategy:
      fail-fast: false
      matrix:
        solution:
          - Shared/Otus.PaymentSystem.Shared.sln
          - Gateway/Otus.PaymentSystem.Gateway.sln
          - Identity/Otus.PaymentSystem.Identity.sln
          - Wallets/Otus.PaymentSystem.Wallets.sln
          - Payments/Otus.PaymentSystem.Payments.sln
          - Fraud/Otus.PaymentSystem.Fraud.sln
          - Notifications/Otus.PaymentSystem.Notifications.sln
          - Audit/Otus.PaymentSystem.Audit.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Shared NuGet packages
        uses: ./.github/actions/shared-packages

      - name: Restore
        run: dotnet restore ${{ matrix.solution }}

      - name: Build
        run: dotnet build ${{ matrix.solution }} --no-restore --configuration Release

  identity-integration-tests:
    name: Identity integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: pack-shared

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: otus_identity_test
          POSTGRES_USER: otus
          POSTGRES_PASSWORD: otus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otus -d otus_identity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      IDENTITY_TEST_DB: "Host=localhost;Port=5432;Database=otus_identity_test;Username=otus;Password=otus"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Shared NuGet packages
        uses: ./.github/actions/shared-packages

      - name: Test
        run: >
          dotnet test
          Identity/test/Otus.PaymentSystem.Identity.Infrastructure.Tests/Otus.PaymentSystem.Identity.Infrastructure.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~EfUserRepositoryPostgresTests"

  wallets-integration-tests:
    name: Wallets integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: pack-shared

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: otus_wallets_api_test
          POSTGRES_USER: otus
          POSTGRES_PASSWORD: otus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otus -d otus_wallets_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WALLETS_API_TEST_DB: "Host=localhost;Port=5432;Database=otus_wallets_api_test;Username=otus;Password=otus"
      WALLETS_REPO_TEST_DB: "Host=localhost;Port=5432;Database=otus_wallets_repo_test;Username=otus;Password=otus"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Shared NuGet packages
        uses: ./.github/actions/shared-packages

      - name: Create repo test DB
        run: |
          PGPASSWORD=otus psql -h localhost -U otus -d otus_wallets_api_test -c "CREATE DATABASE otus_wallets_repo_test;"

      - name: Test
        run: >
          dotnet test Wallets/Otus.PaymentSystem.Wallets.sln
          --configuration Release
          --filter "FullyQualifiedName~Postgres | FullyQualifiedName~IntegrationTests"

  gateway-e2e-tests:
    name: Gateway E2E (Wallets through Gateway)
    runs-on: ubuntu-latest
    needs: pack-shared

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: otus_wallets_api_test
          POSTGRES_USER: otus
          POSTGRES_PASSWORD: otus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otus -d otus_wallets_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WALLETS_API_TEST_DB: "Host=localhost;Port=5432;Database=otus_wallets_api_test;Username=otus;Password=otus"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Shared NuGet packages
        uses: ./.github/actions/shared-packages

      - name: Test
        run: >
          dotnet test
          Gateway/test/Otus.PaymentSystem.Gateway.Host.IntegrationTests/Otus.PaymentSystem.Gateway.Host.IntegrationTests.csproj
          --configuration Release

  openapi-drift:
    name: OpenAPI contract drift
    runs-on: ubuntu-latest
    needs: pack-shared

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Shared NuGet packages
        uses: ./.github/actions/shared-packages

      - name: Build Identity Host
        run: dotnet build Identity/src/Otus.PaymentSystem.Identity.Host/Otus.PaymentSystem.Identity.Host.csproj --configuration Release

      - name: Export and compare OpenAPI
        env:
          ASPNETCORE_ENVIRONMENT: Production
          Swagger__Enabled: "true"
          ConnectionStrings__IdentityDb: "Host=localhost;Database=otus_identity;Username=otus;Password=otus"
        run: |
          # Ключ подписи живёт только на время джоба: в Production Identity без него не стартует.
          export Jwt__PrivateKeyPem="$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null)"
          dotnet run --project Identity/src/Otus.PaymentSystem.Identity.Host --configuration Release --no-build --no-launch-profile --urls http://127.0.0.1:5100 &
          server=$!
          spec=$(mktemp)
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5100/swagger/v1/swagger.json -o "$spec"; then
              mv "$spec" openapi/identity.v1.json
              break
            fi
            sleep 1
          done
          kill $server || true
          git diff --exit-code -- openapi

  openapi-gateway-drift:
    name: OpenAPI gateway drift
    runs-on: ubuntu-latest
    needs: pack-shared

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Shared NuGet packages
        uses: ./.github/actions/shared-packages

      - name: Build Gateway Host
        run: dotnet build Gateway/src/Otus.PaymentSystem.Gateway.Host/Otus.PaymentSystem.Gateway.Host.csproj --configuration Release

      - name: Export and compare OpenAPI
        env:
          ASPNETCORE_ENVIRONMENT: Production
          Swagger__Enabled: "true"
        run: |
          # Identity в джобе нет: Gateway стартует с предупреждением про недоступный JWKS,
          # это ожидаемо и на генерацию спеки не влияет.
          dotnet run --project Gateway/src/Otus.PaymentSystem.Gateway.Host --configuration Release --no-build --no-launch-profile --urls http://127.0.0.1:8080 &
          server=$!
          spec=$(mktemp)
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/swagger/v1/swagger.json -o "$spec"; then
              mv "$spec" openapi/gateway.v1.json
              break
            fi
            sleep 1
          done
          kill $server || true
          git diff --exit-code -- openapi

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: pack-shared
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Shared
            solution: Shared/Otus.PaymentSystem.Shared.sln
            filter: ""
          - name: Gateway
            solution: Gateway/Otus.PaymentSystem.Gateway.sln
            filter: "FullyQualifiedName!~IntegrationTests"
          - name: Identity
            solution: Identity/Otus.PaymentSystem.Identity.sln
            filter: "FullyQualifiedName!~Postgres"
          - name: Wallets
            solution: Wallets/Otus.PaymentSystem.Wallets.sln
            filter: "FullyQualifiedName!~Postgres & FullyQualifiedName!~IntegrationTests"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Shared NuGet packages
        uses: ./.github/actions/shared-packages

      - name: Test (filtered)
        if: matrix.filter != ''
        run: >
          dotnet test ${{ matrix.solution }}
          --configuration Release
          --filter "${{ matrix.filter }}"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Test
        if: matrix.filter == ''
        run: >
          dotnet test ${{ matrix.solution }}
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.name }}
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  docker:
    name: Docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Identity
            dockerfile: Identity/Dockerfile
            tag: otus-identity:ci
          - name: Gateway
            dockerfile: Gateway/Dockerfile
            tag: otus-gateway:ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Публикации нет: образы нужны только как проверка, что Dockerfile
      # и контекст (Directory.Build.props + Shared) не разъехались с кодом.
      # Тег строчными: Docker не принимает заглавные буквы в имени репозитория.
      - name: Build image
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.tag }} .

  client:
    name: Client (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: Client/.nvmrc
          cache: npm
          cache-dependency-path: Client/package-lock.json

      - name: Install
        run: npm ci

      - name: Generated API client is up to date
        run: |
          npm run api:generate
          # status, а не diff: новый тег в спеке — это новый, ещё не отслеживаемый файл.
          if [ -n "$(git status --porcelain -- src/shared/api/generated)" ]; then
            git status --short -- src/shared/api/generated
            echo "::error::Клиент API устарел: запустите npm run api:generate в Client/ и закоммитьте результат."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
