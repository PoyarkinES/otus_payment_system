name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        solution:
          - Shared/Otus.PaymentSystem.Shared.sln
          - Identity/Otus.PaymentSystem.Identity.sln
          - Wallets/Otus.PaymentSystem.Wallets.sln
          - Payments/Otus.PaymentSystem.Payments.sln
          - Fraud/Otus.PaymentSystem.Fraud.sln
          - Notifications/Otus.PaymentSystem.Notifications.sln
          - Audit/Otus.PaymentSystem.Audit.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ matrix.solution }}

      - name: Build
        run: dotnet build ${{ matrix.solution }} --no-restore --configuration Release
