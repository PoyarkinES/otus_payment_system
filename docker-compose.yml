# Демо-стек M2: PostgreSQL 17 + Identity + Wallets + Gateway; образы приложений — из GHCR.
# Наружу открыт только Gateway (8080) — единая точка входа, как в architecture.md.
#
# Запуск:      docker compose -f docker-compose.yml pull
#              docker compose -f docker-compose.yml up -d
# Демо:        http://localhost:8080/health, http://localhost:8080/bff/health
# Локальная разработка: docker-compose.dev.yml (PostgreSQL) + dotnet run;
# этот файл локальный код не собирает.
# С docker-compose.override.yml: docker compose -f docker-compose.yml up -d
# (override публикует postgres на 5434 и конфликтует с dev-контейнером otus-postgres).

name: otus-payment-system

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Порт наружу не публикуем: БД нужна только сервисам внутри сети compose.
    volumes:
      - identity-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  wallets-db-bootstrap:
    image: postgres:17
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ "$$(psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'otus_wallets'")" = "1" ]; then
          echo "Database otus_wallets already exists."
        else
          createdb --maintenance-db=postgres --owner="$$PGUSER" otus_wallets
        fi

  identity:
    image: ghcr.io/poyarkines/otus-payment-system-identity:sha-a6b4e378a113247638b92997572cf2accf7c68ae
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__IdentityDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # Схему применяем на старте: в compose БД всегда чистая.
      Database__AutoMigrate: "true"
      # Без этих двух ключей DevAdminSeeder молча ничего не создаст.
      Seed__Admin__Email: ${SEED_ADMIN_EMAIL:-admin@otus.local}
      Seed__Admin__Password: ${SEED_ADMIN_PASSWORD:-AdminP@ssw0rd}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  wallets:
    image: ghcr.io/poyarkines/otus-payment-system-wallets:sha-a6b4e378a113247638b92997572cf2accf7c68ae
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__WalletsDb: "Host=postgres;Port=5432;Database=otus_wallets;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Database__AutoMigrate: "true"
      Jwt__JwksUri: http://identity:8080/.well-known/jwks.json
    depends_on:
      wallets-db-bootstrap:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  gateway:
    image: ghcr.io/poyarkines/otus-payment-system-gateway:sha-a6b4e378a113247638b92997572cf2accf7c68ae
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Имя сервиса вместо localhost: адрес Identity нужен и прокси, и /bff/health.
      ReverseProxy__Clusters__identity__Destinations__primary__Address: http://identity:8080/
      ReverseProxy__Clusters__wallets__Destinations__primary__Address: http://wallets:8080/
      Jwt__JwksUri: http://identity:8080/.well-known/jwks.json
    ports:
      - "8080:8080"
    depends_on:
      identity:
        condition: service_healthy
      # Wallets не блокирует старт Gateway: его маршруты могут временно
      # отвечать 502/503, пока Wallets поднимается. Health Wallets проверяется отдельно.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/bff/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  identity-db:
